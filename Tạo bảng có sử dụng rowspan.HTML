<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo bảng có sử dụng rowspan</title>
</head>
<body>
    <table border="4", cellspacing="10"
    <thead>
    <tr>
        <th>STT</th>
        <th colspan="2">NAME</th>
        <th>AGE</th>
        <TH colspan="2">EMAIL</TH>
        <th colspan="2">STATUS</th>
        <th colspan="4">Actions</th>
    </tr>
    </thead>
    <tr>
        <td>1</td>
        <td colspan="2">Trần Văn A</td>
        <td>18</td>
        <td colspan="2">NguyenVanA@gmail.com</td>
        <td colspan="2">Hoạt Động</td>
        <td><button>Sửa</button></td>
        <td><button>Xóa</button></td>
        <td rowspan="4">Xóa Tất Cả</td>
    </tr>    
    <tr>
        <td>2</td>
        <td colspan="2">Trần Văn B</td>
        <td>23</td>
        <td colspan="2">TranVanB@gmail.com</td>
        <td colspan="2">Hoạt Động</td>
        <td><button>Sửa</button></td>
        <td><button>Xóa</button></td>
    </tr>  
    <tr>
        <td>3</td>
        <td colspan="2">Phạm Thị C</td>
        <td>19</td>
        <td colspan="2">PhamThiC@gmail.com</td>
        <td colspan="2">Hoạt Động</td>
        <td><button>Sửa</button></td>
        <td><button>Xóa</button></td>
    </tr>  
    <tr>
        <td>4</td>
        <td colspan="2">Phan Văn D</td>
        <td>20</td>
        <td colspan="2">PhanVanD@gmail.com</td>
        <td colspan="2">Không hoạt Động</td>
        <td><button>Sửa</button></td>
        <td><button>Xóa</button></td>
    </tr>  
</body>
</html>
