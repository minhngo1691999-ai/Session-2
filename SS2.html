<!DOCTYPE html>
<html lang="en">
<head>
    <title>Table. Colspan, rowspan</title>
</head>
<body>
    <section>
    <h2> Việt Nam và Thái Lan</h2>
    <table border="2">
        <thead>
            <tr>
                <th rowspan="2">Tên Nước</th>
                <th rowspan="2">Quốc Kỳ</th>
                <th colspan="2">Số Dân</th>
                </tr>
            <tr>
                <th>Năm 2022</th>
                <th>Năm 2023</th>
            </tr>
        </thead>
        <tbody>
            <td>Việt Nam</td>
            <td>
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/2/21/Flag_of_Vietnam.svg/250px-Flag_of_Vietnam.svg.png?utm_source=vi.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Việt Nam">
            </td>
            <td>90 triệu người</td>
            <td>97,5 triệu người</td>
        </tr>
        <tr>
            <td>Thái Lan</td>
            <td>
                <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a9/Flag_of_Thailand.svg/250px-Flag_of_Thailand.svg.png?utm_source=vi.wikipedia.org&utm_campaign=parser&utm_content=thumbnail" alt="Thái Lan">
            </td>
            <td>70 triệu người</td>
            <td>71,7 triệu người</td>
        </tr>
        </tbody>
                <tr>
                </table>
    </section>
</body>
</html>
