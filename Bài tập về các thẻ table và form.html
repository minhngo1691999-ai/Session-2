<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <h1>My Store</h1>
<section>
<table border="1", cellspacing="5">
<thead>
    <tr>
        <th rowspan="3">Item Photo</th>
        <th rowspan="3" >Name</th>

</thead>

        <td>Bananas</td>
        <td>$0.75/lb</td>
    </tr>
    <tr>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmvTn3mUbM50sdDOI8Vw22GWFBk7XbAMcGO6vVA4Fdww&s=10" alt="Pomegranates" height="180" width="180"></td>
        <td>Pomegranates</td>
        <td>3 for $5</td>
    </tr>
    <tr>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7S61zgyywMcuwceX2Pz6zR5JtmrX_Kw5Q0zNJs-cyLA&s=10" alt="Gummy Bears" height="180" width="180"></td>
        <td>Gummy Bears</td>
        <td>$6 per bag</td>
    </tr>
    <tr>
        <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmTS4TmYSYAaXS50RDx4nWN0AdjmMpWbqaWHOGqtvlsg&s=10" alt="Broccoli" height="180" width="180"></td>
        <td>Broccoli</td>

    </tr>
</tbody>    
</table>
</section>
<section>
    <!--Bài 2 Tạo form đặt phòng khách sạn-->
<h1>Booking Form</h1>
<form action="http:www.mysever.com" method=""post"
<Label for="Name"> Name</Label>
<input placeholder="" id="Name" type="text" name="Name"/>
<br>
<br>
<Label for="Email"> Email</Label>
<input placeholder="" id="Mail" type="text" name="Email"/>
<br>
<br>
<Label for="Phone"> Phone</Label>
<input placeholder="" id="Phone" type="text" name="Phone"/>
<br>
<br>
<Label for="Date"> Date</Label>
<input placeholder="" id="Date" type="Date" name="Date"/>
<br>
<br>
<Label for="Time"> Time</Label>
<input placeholder="" id="Time" type="Time" name="Time"/>
<br>
<br>
<Label for="Number of Guests"> Number of Guests</Label>
<input placeholder="" id="Number of guests" type="Number of guests" name="Number of guests"/>
<br>
<br>
<button>Submit</button>
</section>
<section>
    <!--Bài 3 Tạo form mua xe-->
    <h1>Car Purchase Form</h1>
<form action="http:www.mysever.com" method=""post"
<Label for="Name"> Name</Label>
<input placeholder="" id="Name" type="text" name="Name"/>
<br>
<br>
<Label for="Email"> Email</Label>
<input placeholder="" id="Mail" type="text" name="Email"/>
<br>
<br>
<Label for="Phone"> Phone</Label>
<input placeholder="" id="Phone" type="text" name="Phone"/>
<br>
<br>
<Label for="Choose a Car"> Choose a Car</Label>
<select name="Choose a Car:">
    <option value="Model 1">Model 1</option>
    <option value="Model 2">Model 2</option>
    </select>
<br>
<br>
<Label for="Choose a Color"> Choose a Color</Label>
<select name="Choose a Color:">
    <option value="Red">Red</option>
    <option value="Blue">Blue</option>
</select>
<br>
<br>
<Label for="Quantity"> Quantity</Label>
<input placeholder="" id="Quantity" type="Quantity" name="Quantity"/>
<br>
<br>
<Label for="Date"> Delivery Date</Label>
<input placeholder="" id="Date" type="Date" name="Delivery Date"/>
<br>
<br>
<button>Submit</button>
</section>
</body>
</html>
